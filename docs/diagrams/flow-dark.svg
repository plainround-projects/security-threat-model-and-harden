<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="t d">
<title id="t">One PATCH, through every control</title>
<desc id="d">Nine rows across five lanes follow PATCH /notes/42 by a signed-in user. The browser sends the cookie and CSRF token to the Flask app, load_session asks SessionService to resolve it, and enforce_csrf compares the token in constant time. A wrong token branches off step 3 as a 403 with an audit row. The route calls NoteService, which loads the note and its shares from PostgreSQL and applies the policy. With no access it answers 404 and writes a note.access_denied audit row. Otherwise the new values are validated and written with bound parameters, and the response leaves with security headers and one log line that carries no body, cookie or query.</desc>
<style>
:root{--paper:#0d1117;--ink:#f5f4f8;--mute:#9a96ab;--accent:#6ec8ff;--good:#7ce0a1;--warn:#ffd166}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="859" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="858" rx="16"/>
<text class="title" x="48" y="68">One PATCH, through every control</text>
<text class="caption" x="48" y="100">PATCH /notes/42 by a signed-in user. Amber: a wrong CSRF token or a note you cannot see is refused.</text>
<rect class="actor" x="410" y="128" width="120" height="48" rx="24"/>
<text class="lane" x="470" y="158" text-anchor="middle">Browser</text>
<rect class="svc" x="550" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="610" y="158" text-anchor="middle">Flask app</text>
<rect class="svc" x="690" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="750" y="148" text-anchor="middle">Session</text>
<text class="lane" x="750" y="168" text-anchor="middle">Service</text>
<rect class="svc" x="830" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="890" y="148" text-anchor="middle">Note</text>
<text class="lane" x="890" y="168" text-anchor="middle">Service</text>
<rect class="svc" x="995" y="128" width="130" height="48" rx="10"/>
<text class="lane" x="1060" y="158" text-anchor="middle">PostgreSQL</text>
<path class="hair" d="M470 176V744M610 176V744M750 176V312M890 176V680M1060 176V680"/>
<path class="hair" d="M66 216V728"/>

<circle class="dot" cx="66" cy="216" r="15"/><text class="num" x="66" y="221" text-anchor="middle">1</text>
<text class="label b t-ink" x="96" y="212">Request arrives</text>
<text class="sub" x="96" y="232">cookie + X-CSRF-Token, HTTPS</text>
<path class="sync" d="M470 216H610"/>
<text class="label t-accent" x="486" y="206">PATCH, cookie</text>

<circle class="dot" cx="66" cy="280" r="15"/><text class="num" x="66" y="285" text-anchor="middle">2</text>
<text class="label b t-ink" x="96" y="276">load_session resolves</text>
<text class="sub" x="96" y="296">hash, 8 h absolute, 30 min idle</text>
<path class="sync" d="M610 280H750"/>
<text class="label t-accent" x="626" y="270">resolve</text>

<circle class="dot" cx="66" cy="344" r="15"/><text class="num" x="66" y="349" text-anchor="middle">3</text>
<text class="label b t-ink" x="96" y="340">enforce_csrf compares</text>
<text class="sub" x="96" y="360">constant time, 403 if wrong</text>
<rect class="slot" x="604" y="326" width="12" height="36" rx="4"/>
<text class="label t-accent" x="626" y="349">csrf compare</text>

<circle class="dot-w" cx="66" cy="408" r="15"/><text class="num" x="66" y="413" text-anchor="middle">3x</text>
<text class="label b t-warn" x="96" y="404">Wrong token: 403, audit row</text>
<text class="sub" x="96" y="424">csrf.rejected, no route runs</text>
<path class="fail" d="M610 408H470"/>
<text class="label t-warn" x="486" y="398">403</text>

<circle class="dot" cx="66" cy="472" r="15"/><text class="num" x="66" y="477" text-anchor="middle">4</text>
<text class="label b t-ink" x="96" y="468">Route calls NoteService</text>
<text class="sub" x="96" y="488">user id from the session only</text>
<path class="sync" d="M610 472H890"/>
<text class="label t-accent" x="626" y="462">update(42)</text>

<circle class="dot" cx="66" cy="536" r="15"/><text class="num" x="66" y="541" text-anchor="middle">5</text>
<text class="label b t-ink" x="96" y="532">Policy: owner, reader, none</text>
<text class="sub" x="96" y="552">loads the note and its shares</text>
<path class="sync" d="M890 536H1060"/>
<text class="label t-accent" x="906" y="526">note + shares</text>

<circle class="dot-w" cx="66" cy="600" r="15"/><text class="num" x="66" y="605" text-anchor="middle">5x</text>
<text class="label b t-warn" x="96" y="596">No access: 404, audit row</text>
<text class="sub" x="96" y="616">note.access_denied, no id oracle</text>
<path class="fail" d="M890 600H610"/>
<text class="label t-warn" x="626" y="590">404</text>

<circle class="dot" cx="66" cy="664" r="15"/><text class="num" x="66" y="669" text-anchor="middle">6</text>
<text class="label b t-ink" x="96" y="660">Validate, then bind</text>
<text class="sub" x="96" y="680">length, no NUL; bound parameters</text>
<path class="sync" d="M890 664H1060"/>
<text class="label t-accent" x="906" y="654">UPDATE (bound)</text>

<circle class="dot-g" cx="66" cy="728" r="15"/><text class="num" x="66" y="733" text-anchor="middle">7</text>
<text class="label b t-ink" x="96" y="724">Headers and one log line</text>
<text class="sub" x="96" y="744">CSP, no-store, request id</text>
<rect class="slot" x="604" y="710" width="12" height="36" rx="4"/>
<path class="ok" d="M604 728H470"/>
<text class="label t-good" x="486" y="718">200, headers</text>
<path class="ok" d="M616 728H650"/>
<rect class="win" x="650" y="708" width="300" height="40" rx="10"/>
<text class="label b t-good" x="666" y="733">log: no body, cookie or query</text>

<path class="sync" d="M48 816H112"/><text class="legend" x="124" y="821">sync call</text>
<path class="fail" d="M696 816H760"/><text class="legend" x="772" y="821">failure path</text>
<path class="ok" d="M928 816H992"/><text class="legend" x="1004" y="821">result</text>
</svg>
