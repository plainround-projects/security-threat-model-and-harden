<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
<title id="t">A notes app that proves its controls</title>
<desc id="d">A browser sends HTTPS requests with a session cookie to the Flask app, which sets cookie, CSRF and security headers. Inside one gunicorn process of 2 workers and 4 threads each, the Flask app calls the application layer: AccountService, SessionService and NoteService, which check the domain Rules for validation, access and throttle. Through ports the services reach the PostgreSQL adapters and the argon2id hasher, and the adapters talk to PostgreSQL 18 with bound parameters under the role notes_app, which has no DDL and an append-only audit table. A weaknesses folder, for tests only and off by default, backs make prove: remove one control and the test that guards it fails.</desc>
<style>
:root{--paper:#0d1117;--ink:#f5f4f8;--mute:#9a96ab;--accent:#6ec8ff;--good:#7ce0a1;--warn:#ffd166}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="899" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="898" rx="16"/>
<text class="title" x="48" y="68">A notes app that proves its controls</text>
<text class="caption" x="48" y="100">Each arrow is a trust boundary. Amber: remove a control and the test that guards it fails.</text>

<rect class="actor" x="48" y="200" width="168" height="72" rx="36"/>
<text class="name" x="132" y="232" text-anchor="middle">Browser</text>
<text class="sub" x="132" y="254" text-anchor="middle">session cookie</text>

<rect class="boundary" x="312" y="132" width="840" height="508" rx="14"/>
<text class="tag" x="328" y="156">gunicorn: 2 workers, 4 threads each</text>

<rect class="svc" x="336" y="192" width="216" height="116" rx="12"/>
<text class="name" x="352" y="224">Flask app</text>
<text class="sub" x="352" y="248">routes, error mapping</text>
<text class="sub" x="352" y="270">cookie, CSRF hook,</text>
<text class="sub" x="352" y="292">security headers</text>

<rect class="boundary" x="616" y="168" width="280" height="292" rx="14"/>
<text class="tag" x="632" y="192">application</text>
<rect class="svc" x="640" y="208" width="232" height="72" rx="12"/>
<text class="name" x="656" y="240">AccountService</text>
<text class="sub" x="656" y="262">sign up, sign in</text>
<rect class="svc" x="640" y="292" width="232" height="72" rx="12"/>
<text class="name" x="656" y="324">SessionService</text>
<text class="sub" x="656" y="346">issue, rotate, expire</text>
<rect class="svc" x="640" y="376" width="232" height="72" rx="12"/>
<text class="name" x="656" y="408">NoteService</text>
<text class="sub" x="656" y="430">authorize on every call</text>

<rect class="svc" x="944" y="208" width="184" height="140" rx="12"/>
<text class="name" x="960" y="240">Rules</text>
<text class="sub" x="960" y="264">domain</text>
<text class="sub" x="960" y="286">validation,</text>
<text class="sub" x="960" y="308">access, throttle,</text>
<text class="sub" x="960" y="330">models, errors</text>

<rect class="note" x="336" y="360" width="248" height="118" rx="10"/>
<text class="label b t-warn" x="352" y="388">make prove</text>
<text class="sub" x="352" y="412">7 weaknesses, all off:</text>
<text class="sub" x="352" y="434">remove one control,</text>
<text class="sub" x="352" y="456">its test fails</text>

<rect class="svc" x="336" y="520" width="236" height="96" rx="12"/>
<text class="name" x="352" y="552">weaknesses/</text>
<text class="sub" x="352" y="576">tests only,</text>
<text class="sub" x="352" y="598">off by default</text>
<rect class="svc" x="588" y="520" width="268" height="96" rx="12"/>
<text class="name" x="604" y="552">PostgreSQL adapters</text>
<text class="sub" x="604" y="576">users, notes, sessions,</text>
<text class="sub" x="604" y="598">audit, login failures</text>
<rect class="svc" x="872" y="520" width="248" height="96" rx="12"/>
<text class="name" x="888" y="552">argon2id hasher</text>
<text class="sub" x="888" y="576">19 MiB, 2 iterations,</text>
<text class="sub" x="888" y="598">1 lane</text>

<path class="store" d="M620 702a116 12 0 0 1 232 0v98a116 12 0 0 1 -232 0z"/>
<path class="rim" d="M620 702a116 12 0 0 0 232 0"/>
<text class="name" x="736" y="734" text-anchor="middle">PostgreSQL 18</text>
<text class="sub" x="736" y="756" text-anchor="middle">role notes_app: no DDL</text>
<text class="sub" x="736" y="778" text-anchor="middle">audit append-only</text>

<path class="sync" d="M216 236H336"/>
<text class="label t-accent" x="228" y="224">HTTPS</text>
<path class="sync" d="M552 238H616"/>
<path class="sync" d="M896 238H944"/>
<path class="sync" d="M736 460V520"/>
<path class="sync" d="M884 460V520"/>
<text class="label t-accent" x="748" y="496">through ports</text>
<path class="sync" d="M736 616V690"/>
<text class="label t-accent" x="748" y="664">SQL, bound parameters</text>
<path class="fail" d="M460 520V478"/>

<path class="sync" d="M48 856H112"/><text class="legend" x="124" y="861">sync call</text>
<path class="fail" d="M696 856H760"/><text class="legend" x="772" y="861">failure path</text>
</svg>
