# PostgreSQL 18 for local use, and the application as an image under the `app` profile.
name: security-threat-model-and-harden

services:
  postgres:
    image: postgres:18
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5471}:5432"
    environment:
      # Credentials come from .env (make up copies .env.example the first time); none is written here.
      POSTGRES_USER: ${POSTGRES_USER:-notes_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env first}
      POSTGRES_DB: ${POSTGRES_DB:-notes}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20

  app:
    profiles: ["app"]
    build: .
    image: security-threat-model-and-harden:dev
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      APP_HOST: 0.0.0.0
      NOTES_DB_HOST: postgres
      NOTES_DB_PORT: 5432
    ports:
      - "127.0.0.1:${APP_PORT:-8047}:${APP_PORT:-8047}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
